name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @fionas/inquiry-to-commerce
      - run: npm run test:integration
      - run: docker build -f workers/inquiry-to-commerce/Dockerfile -t fionas-inquiry-to-commerce:ci .
