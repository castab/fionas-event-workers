# LOCAL DEVELOPMENT ONLY. Never deploy these public passwords in production.
server_name: fionas-workers-local
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 1MB
jetstream { store_dir: /data, max_memory_store: 64MB, max_file_store: 1GB }
accounts {
  FIONAS {
    jetstream: enabled
    users: [
      { user: fionas-admin, password: fionas-admin-dev }
      # Matches upstream's deliberately publish-only public identity.
      {
        user: fionas-web, password: fionas-web-dev
        permissions: {
          publish: { allow: ["fionas.inquiries.submitted.v1"] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        user: inquiry-to-commerce, password: inquiry-to-commerce-dev
        permissions: {
          publish: { allow: [
            "$JS.API.CONSUMER.INFO.FIONAS_INQUIRIES.inquiry-to-commerce",
            "$JS.API.CONSUMER.MSG.NEXT.FIONAS_INQUIRIES.inquiry-to-commerce",
            "$JS.ACK.FIONAS_INQUIRIES.inquiry-to-commerce.>",
            "$JS.ACK.*.*.FIONAS_INQUIRIES.inquiry-to-commerce.>",
            # Failure diagnostics only. Success events belong to the commerce outbox publisher.
            "fionas.events.inquiry.processing-failed.v1"
          ] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
}
